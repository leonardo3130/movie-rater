name: .NET

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MovieRaterApi/MovieRaterApi.csproj

      - name: Build
        run: dotnet build MovieRaterApi/MovieRaterApi.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test MovieRaterApi.Tests/MovieRaterApi.Tests.csproj --configuration Release --verbosity normal
