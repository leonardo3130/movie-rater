gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

server {
    listen 5173;
    server_name _;
    server_tokens off;

    # Requests reach nginx through cloudflared on the Docker network. Trust the client IP
    # Cloudflare reports only when the connection comes from there, so it cannot be spoofed
    # by clients connecting to the published port directly.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    root /usr/share/nginx/html;
    index index.html;

    # Same role as the Vite dev proxy: the SPA calls relative /api URLs
    # Resolve the api container through Docker's DNS on each request rather than once at startup,
    # so nginx keeps working when the api container is recreated with a new IP
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite rather than append: the API trusts only the last hop, and a
        # client-supplied X-Forwarded-For must never reach it.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Vite emits content-hashed file names under /assets, so they can be cached forever
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # nginx's mime.types has no entry for .webmanifest
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Client-side routes (e.g. invite links) fall back to the SPA entry point.
    # no-cache also covers sw.js, so browsers pick up new deploys on their next update check
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
