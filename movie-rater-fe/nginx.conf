gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same role as the Vite dev proxy: the SPA calls relative /api URLs
    # Resolve the api container through Docker's DNS on each request rather than once at startup,
    # so nginx keeps working when the api container is recreated with a new IP
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vite emits content-hashed file names under /assets, so they can be cached forever
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # nginx's mime.types has no entry for .webmanifest
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Client-side routes (e.g. invite links) fall back to the SPA entry point.
    # no-cache also covers sw.js, so browsers pick up new deploys on their next update check
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
